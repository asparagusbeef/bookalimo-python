[tox]
envlist =
    py{39,310,311,312,313}
    py{39,313}-noplaces
    lint
    typecheck
    security
    docs
minversion = 4.0

[gh-actions]
python =
    3.9: py39
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313

[testenv]
extras =
    test
    places
deps =
    pytest
    pytest-asyncio
    pytest-cov
    pytest-mock
    httpx[mock]
    respx
commands =
    pytest {posargs:-v --cov=bookalimo --cov-report=term-missing}

[testenv:py{39,313}-noplaces]
extras = test
deps =
    pytest
    pytest-asyncio
    pytest-cov
    pytest-mock
    httpx[mock]
    respx
commands =
    pytest {posargs:-v --cov=bookalimo --cov-report=term-missing -k "not test_google_places and not places"}

[testenv:lint]
deps =
    ruff
commands =
    ruff check .
    ruff format --check .

[testenv:typecheck]
deps =
    mypy
    types-protobuf
extras = dev
commands =
    mypy src/bookalimo --config-file pyproject.toml

[testenv:security]
deps =
    bandit[toml]
    safety
commands =
    bandit -r src/ --format json --output bandit-report.json
    safety check

[testenv:performance]
extras =
    test
    places
deps =
    pytest
    pytest-asyncio
    httpx[mock]
    respx
commands =
    pytest -v -m "performance" --durations=10

[testenv:integration]
extras =
    test
    places
deps =
    pytest
    pytest-asyncio
    httpx[mock]
    respx
passenv =
    GOOGLE_PLACES_API_KEY
    BOOKALIMO_TESTING_USER
commands =
    pytest -v -m "integration" --durations=10

[testenv:docs]
deps =
    mkdocs
    mkdocs-material
    mkdocstrings[python]
commands =
    mkdocs build --strict

[testenv:coverage-report]
deps = coverage[toml]
skip_install = true
commands =
    coverage combine
    coverage report --show-missing
    coverage html
    coverage xml

[testenv:clean]
deps = coverage[toml]
skip_install = true
commands = coverage erase
