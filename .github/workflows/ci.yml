name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write  # needed for mkdocs gh-deploy to push to gh-pages

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test,places]"

      - name: Lint with ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Type check with mypy
        run: |
          mypy src/bookalimo

      - name: Test with pytest
        run: |
          pytest --cov=bookalimo --cov-report=xml --cov-report=html

  docs:
    name: Build & Deploy Docs
    runs-on: ubuntu-latest
    needs: test
    # Only deploy docs on pushes to main (avoid PRs/matrix duplicates)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: docs-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Configure Git Credentials (for gh-deploy)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Cache mkdocs-material
        uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ runner.os }}-${{ hashFiles('docs/mkdocs.yml') }}
          path: ~/.cache
          restore-keys: |
            mkdocs-material-

      - name: Debug mkdocs layout
        run: |
            pwd
            ls -la
            find . -maxdepth 3 -iname 'mkdocs.y*' -o -iname 'index.md'


      - name: Install MkDocs deps
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs-material

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force -f ./docs/mkdocs.yml
