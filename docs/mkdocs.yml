site_name: Book-A-Limo Python SDK
site_description: Python wrapper for the Book-A-Limo API
site_author: Your Name
site_url: https://yourusername.github.io/bookalimo-python

repo_name: yourusername/bookalimo-python
repo_url: https://github.com/yourusername/bookalimo-python

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
  language: en
  palette:
    - scheme: default
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
      primary: blue
      accent: purple
    - scheme: slate
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode
      primary: blue
      accent: lime

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google

nav:
  - Home: index.md
  - Quick Start: quickstart.md
  - Examples: examples.md
  - API Reference:
    - Client: reference/client.md
    - Models: reference/models.md
    - Wrapper: reference/wrapper.md
  - API Documentation: api.md
